name: Unit tests
on: pull_request
jobs:
  run-unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout under $GITHUB_WORKSPACE
        uses: actions/checkout@v7
      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install all dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Unit Tests
        run: npm run test
